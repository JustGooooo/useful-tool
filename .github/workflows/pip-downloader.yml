name: Pip 包下载

on:
  issues:
    types: [labeled]

jobs:
  download-pip:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'pip-downloader')
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析 Issue 参数
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          extract_field() {
            echo "$ISSUE_BODY" | grep -A10 "$1" | grep -v "^###" | grep -v "^--$" | sed '/^$/d' | head -1 | xargs
          }

          PACKAGE_NAME=$(extract_field "### 包名")
          PYTHON_VERSION=$(extract_field "### Python 版本")
          PLATFORM=$(extract_field "### 目标平台")
          PACKAGE_VERSION=$(extract_field "### 包版本（可选）")
          # Issue Forms 留空字段返回 "_No response_"
          if [ "$PACKAGE_VERSION" = "_No response_" ]; then
            PACKAGE_VERSION=""
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::未找到包名"
            exit 1
          fi
          if [ -z "$PYTHON_VERSION" ]; then
            echo "::error::未找到 Python 版本"
            exit 1
          fi
          if [ -z "$PLATFORM" ]; then
            echo "::error::未找到目标平台"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          echo "📦 包名: $PACKAGE_NAME"
          echo "🐍 Python: $PYTHON_VERSION"
          echo "💻 平台: $PLATFORM"
          echo "📋 版本: ${PACKAGE_VERSION:-最新版}"

      - name: 更新 Issue 标题
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = '${{ steps.parse.outputs.package_name }}';
            const pyVer = '${{ steps.parse.outputs.python_version }}';
            const platform = '${{ steps.parse.outputs.platform }}';
            const pkgVer = '${{ steps.parse.outputs.package_version }}';
            let title = `[pip] ${pkg} - Python ${pyVer} (${platform})`;
            if (pkgVer && pkgVer !== '_No response_') {
              title += ` ${pkgVer}`;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: title
            });

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载 pip 包及依赖
        id: download
        env:
          PACKAGE_NAME: ${{ steps.parse.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.parse.outputs.package_version }}
          PLATFORM: ${{ steps.parse.outputs.platform }}
          PYTHON_VERSION: ${{ steps.parse.outputs.python_version }}
        run: |
          mkdir -p /tmp/pip-output

          if [ -n "$PACKAGE_VERSION" ]; then
            DOWNLOAD_TARGET="${PACKAGE_NAME}==${PACKAGE_VERSION}"
          else
            DOWNLOAD_TARGET="$PACKAGE_NAME"
          fi

          pip download "$DOWNLOAD_TARGET" \
            --platform "$PLATFORM" \
            --python-version "$PYTHON_VERSION" \
            --only-binary=:all: \
            --dest /tmp/pip-output \
            --no-cache-dir

          WHL_COUNT=$(ls /tmp/pip-output/*.whl 2>/dev/null | wc -l)
          TOTAL_SIZE=$(du -sb /tmp/pip-output | cut -f1)

          echo "whl_count=$WHL_COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT
          echo "total_size_mb=$((TOTAL_SIZE / 1024 / 1024))" >> $GITHUB_OUTPUT

          echo "✅ 共下载 $WHL_COUNT 个 .whl 文件"
          ls -lh /tmp/pip-output/*.whl

      - name: 打包为 tar.gz
        id: package
        env:
          PACKAGE_NAME: ${{ steps.parse.outputs.package_name }}
          PYTHON_VERSION: ${{ steps.parse.outputs.python_version }}
          PLATFORM: ${{ steps.parse.outputs.platform }}
        run: |
          TIMESTAMP=$(TZ="Asia/Shanghai" date +'%Y%m%d-%H%M%S')
          ARCHIVE_NAME="pip-${PACKAGE_NAME}-py${PYTHON_VERSION}-${PLATFORM}-${TIMESTAMP}.tar.gz"
          RELEASE_NAME="${PACKAGE_NAME} (Python ${PYTHON_VERSION}, ${PLATFORM}) - $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"

          tar -czf "$ARCHIVE_NAME" -C /tmp/pip-output .

          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=pip-${PACKAGE_NAME}-py${PYTHON_VERSION}-${PLATFORM}-${TIMESTAMP}" >> $GITHUB_OUTPUT

          echo "📦 已打包: $ARCHIVE_NAME ($(du -h "$ARCHIVE_NAME" | cut -f1))"

      - name: 选择上传方式
        id: upload_method
        env:
          TOTAL_SIZE: ${{ steps.download.outputs.total_size }}
        run: |
          if [ "$TOTAL_SIZE" -lt 2147483648 ]; then
            echo "method=release" >> $GITHUB_OUTPUT
            echo "📁 文件 < 2GB，使用 Release 上传"
          else
            if [ "$TOTAL_SIZE" -lt 5368709120 ]; then
              echo "method=artifact" >> $GITHUB_OUTPUT
              echo "📁 文件 ≥ 2GB，使用 Artifact 上传（90 天保留）"
            else
              echo "::error::文件超过 5GB，无法上传"
              exit 1
            fi
          fi

      - name: 创建 GitHub Release
        if: steps.upload_method.outputs.method == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: ${{ steps.package.outputs.release_name }}
          body: |
            ## ${{ steps.parse.outputs.package_name }} (Python ${{ steps.parse.outputs.python_version }}, ${{ steps.parse.outputs.platform }})

            - **包名**: ${{ steps.parse.outputs.package_name }}
            - **Python 版本**: ${{ steps.parse.outputs.python_version }}
            - **平台**: ${{ steps.parse.outputs.platform }}
            - **包含 .whl 文件数**: ${{ steps.download.outputs.whl_count }}
            - **总大小**: ${{ steps.download.outputs.total_size_mb }} MB

            ### 离线安装方法

            ```bash
            tar -xzf ${{ steps.package.outputs.archive_name }}
            pip install --no-index --find-links=. ${{ steps.parse.outputs.package_name }}
            ```
          files: ${{ steps.package.outputs.archive_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Artifact
        if: steps.upload_method.outputs.method == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: pip-${{ steps.parse.outputs.package_name }}-py${{ steps.parse.outputs.python_version }}-${{ steps.parse.outputs.platform }}
          path: /tmp/pip-output/*.whl
          retention-days: 90

      - name: 成功反馈
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = '${{ steps.parse.outputs.package_name }}';
            const pyVer = '${{ steps.parse.outputs.python_version }}';
            const platform = '${{ steps.parse.outputs.platform }}';
            const whlCount = '${{ steps.download.outputs.whl_count }}';
            const method = '${{ steps.upload_method.outputs.method }}';

            let body = `✅ Pip 包下载成功！\n\n`;
            body += `- **包名**：${pkg}\n`;
            body += `- **Python 版本**：${pyVer}\n`;
            body += `- **平台**：${platform}\n`;
            body += `- **包含 .whl 文件数**：${whlCount}\n`;

            if (method === 'release') {
              const tag = '${{ steps.package.outputs.tag_name }}';
              const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;
              body += `- **上传方式**：Release\n`;
              body += `- **Release 链接**：[点击下载](${url})\n`;
            } else {
              body += `- **上传方式**：Artifact（90 天保留）\n`;
              body += `\n⚠️ 文件超过 2GB，已上传到 Artifact，90 天后自动删除。\n`;
            }

            body += `\n### 离线安装\n\`\`\`bash\ntar -xzf pip-${pkg}-py${pyVer}-${platform}-*.tar.gz\npip install --no-index --find-links=. ${pkg}\n\`\`\``;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['success']
            });

            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });

      - name: 失败反馈
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = '${{ steps.parse.outputs.package_name }}';
            const pyVer = '${{ steps.parse.outputs.python_version }}';
            const platform = '${{ steps.parse.outputs.platform }}';
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ Pip 包下载失败\n\n- **包名**：${pkg}\n- **Python 版本**：${pyVer}\n- **平台**：${platform}\n- **构建日志**：[点击查看](${run_url})`
            });

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['failure']
            });

            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
