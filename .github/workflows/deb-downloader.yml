name: Deb 包下载

on:
  issues:
    types: [labeled]

jobs:
  download-deb:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    if: contains(github.event.issue.labels.*.name, 'deb-downloader')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析 Issue 参数
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Issue Forms 渲染格式为: ### Label\n\nvalue（标题和值之间有空行）
          # 用 grep -A3 取标题后3行，过滤空行和标题行，取剩余内容
          extract_field() {
            echo "$ISSUE_BODY" | grep -A3 "$1" | grep -v "^###" | grep -v "^--$" | sed '/^$/d' | head -1 | xargs
          }

          # 软件包名是 textarea，可能多行
          PACKAGE_NAMES=$(echo "$ISSUE_BODY" | sed -n '/### 软件包名/,/### Ubuntu 版本/p' | grep -v "^###" | grep -v "^--$" | sed '/^$/d' | sed 's/^[[:space:]]*//' | tr '\n' '|' | sed 's/|$//')
          UBUNTU_VERSION=$(extract_field "### Ubuntu 版本")

          if [ -z "$PACKAGE_NAMES" ] || [ "$PACKAGE_NAMES" = "_No response_" ]; then
            echo "::error::未找到软件包名"
            exit 1
          fi
          if [ -z "$UBUNTU_VERSION" ]; then
            echo "::error::未找到 Ubuntu 版本"
            exit 1
          fi

          # 统计包数量
          PKG_COUNT=$(echo "$PACKAGE_NAMES" | tr '|' '\n' | wc -l)
          FIRST_PKG=$(echo "$PACKAGE_NAMES" | cut -d'|' -f1)

          echo "package_names=$PACKAGE_NAMES" >> $GITHUB_OUTPUT
          echo "ubuntu_version=$UBUNTU_VERSION" >> $GITHUB_OUTPUT
          echo "pkg_count=$PKG_COUNT" >> $GITHUB_OUTPUT

          echo "📦 包名: $PACKAGE_NAMES"
          echo "🐧 Ubuntu: $UBUNTU_VERSION"
          echo "📋 数量: $PKG_COUNT"

          # 提取自定义仓库（textarea，可能多行）
          CUSTOM_REPOS=$(echo "$ISSUE_BODY" | sed -n '/### 自定义仓库（可选）/,$ p' | grep -v "^###" | grep -v "^--$" | sed '/^$/d' | sed 's/^[[:space:]]*//')
          if [ "$CUSTOM_REPOS" = "_No response_" ]; then
            CUSTOM_REPOS=""
          fi
          echo "custom_repos<<EOF" >> $GITHUB_OUTPUT
          echo "$CUSTOM_REPOS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "🔗 自定义源: ${CUSTOM_REPOS:-无}"

      - name: 更新 Issue 标题
        uses: actions/github-script@v7
        with:
          script: |
            const pkgs = '${{ steps.parse.outputs.package_names }}'.split('|');
            const ver = '${{ steps.parse.outputs.ubuntu_version }}';
            const count = parseInt('${{ steps.parse.outputs.pkg_count }}');
            let title = `[deb] ${pkgs[0]}`;
            if (count > 1) title += ` +${count - 1}`;
            title += ` - Ubuntu ${ver}`;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: title
            });

      - name: 安装 debootstrap
        run: sudo apt-get update && sudo apt-get install -y debootstrap

      - name: 创建目标 Ubuntu 环境
        env:
          UBUNTU_VERSION: ${{ steps.parse.outputs.ubuntu_version }}
        run: |
          # 版本号 → codename 映射（debootstrap 需要 codename）
          declare -A CODENAMES=(
            ["20.04"]="focal"
            ["22.04"]="jammy"
            ["24.04"]="noble"
            ["24.10"]="oracular"
            ["25.04"]="plucky"
            ["25.10"]="questing"
            ["26.04"]="resolute"
          )
          CODENAME="${CODENAMES[$UBUNTU_VERSION]:-$UBUNTU_VERSION}"

          echo "正在为 Ubuntu $UBUNTU_VERSION ($CODENAME) 创建最小根文件系统..."
          sudo debootstrap "$CODENAME" /target http://archive.ubuntu.com/ubuntu
          sudo chroot /target cat /etc/os-release

      - name: 添加自定义仓库
        if: steps.parse.outputs.custom_repos != ''
        env:
          CUSTOM_REPOS: ${{ steps.parse.outputs.custom_repos }}
        run: |
          echo "📦 添加自定义仓库..."
          sudo mkdir -p /target/etc/apt/keyrings

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # 格式：仓库地址|GPG Key URL（GPG 可选）
            REPO_URL=$(echo "$line" | cut -d'|' -f1 | xargs)
            GPG_URL=$(echo "$line" | cut -d'|' -f2 | xargs)

            echo "  添加: $REPO_URL"

            # 下载并安装 GPG key
            if [ -n "$GPG_URL" ]; then
              KEY_NAME=$(echo "$GPG_URL" | md5sum | cut -d' ' -f1)
              curl -fsSL "$GPG_URL" | sudo gpg --dearmor -o "/target/etc/apt/keyrings/${KEY_NAME}.gpg"
              SIGNED_BY="[signed-by=/etc/apt/keyrings/${KEY_NAME}.gpg] "
            else
              SIGNED_BY=""
            fi

            # 判断是 .list 文件 URL 还是直接的仓库 URL
            if echo "$REPO_URL" | grep -q "\.list$"; then
              # .list 文件：下载并修改添加 signed-by
              curl -sL "$REPO_URL" | sed "s#deb https://#deb ${SIGNED_BY}https://#g" | sudo tee -a /target/etc/apt/sources.list.d/custom.list > /dev/null
            else
              # 直接仓库 URL
              CODENAME=$(grep "^VERSION_CODENAME=" /target/etc/os-release | cut -d= -f2)
              echo "deb ${SIGNED_BY}${REPO_URL} ${CODENAME} main" | sudo tee -a /target/etc/apt/sources.list.d/custom.list > /dev/null
            fi
          done <<< "$CUSTOM_REPOS"

          echo "✅ 自定义仓库添加完成"

      - name: 下载包及依赖
        id: download
        env:
          PACKAGE_NAMES: ${{ steps.parse.outputs.package_names }}
        run: |
          sudo mkdir -p /target/output

          sudo chroot /target apt-get update
          sudo chroot /target apt-get install -y apt-utils

          # 遍历所有包名，逐个下载
          IFS='|' read -r -a PKG_ARRAY <<< "$PACKAGE_NAMES"
          for pkg in "${PKG_ARRAY[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            echo "📥 下载: $pkg"
            sudo chroot /target bash -c "
              cd /output && \
              apt-get download \$(apt-cache depends --recurse \
                --no-recommends --no-suggests \
                --no-conflicts --no-breaks \
                --no-replaces --no-enhances \
                ${pkg} 2>/dev/null \
                | grep '^\w' | sort -u) 2>&1 || true
            "
          done

          DEB_COUNT=$(ls /target/output/*.deb 2>/dev/null | wc -l)
          echo "deb_count=$DEB_COUNT" >> $GITHUB_OUTPUT

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "::error::未下载到任何 .deb 文件，包名可能不存在"
            exit 1
          fi

          echo "✅ 共下载 $DEB_COUNT 个 .deb 文件"
          ls -lh /target/output/*.deb

      - name: 打包为 tar.gz
        id: package
        env:
          PACKAGE_NAMES: ${{ steps.parse.outputs.package_names }}
          PKG_COUNT: ${{ steps.parse.outputs.pkg_count }}
          UBUNTU_VERSION: ${{ steps.parse.outputs.ubuntu_version }}
        run: |
          FIRST_PKG=$(echo "$PACKAGE_NAMES" | cut -d'|' -f1)
          TIMESTAMP=$(TZ="Asia/Shanghai" date +'%Y%m%d-%H%M%S')

          if [ "$PKG_COUNT" -gt 1 ]; then
            ARCHIVE_NAME="deb-${FIRST_PKG}-and-$((PKG_COUNT-1))-more-ubuntu${UBUNTU_VERSION}-${TIMESTAMP}.tar.gz"
            RELEASE_NAME="${FIRST_PKG} +$((PKG_COUNT-1)) for Ubuntu ${UBUNTU_VERSION} - $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          else
            ARCHIVE_NAME="deb-${FIRST_PKG}-ubuntu${UBUNTU_VERSION}-${TIMESTAMP}.tar.gz"
            RELEASE_NAME="${FIRST_PKG} for Ubuntu ${UBUNTU_VERSION} - $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          fi

          tar -czf "$ARCHIVE_NAME" -C /target/output .

          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=deb-${FIRST_PKG}-ubuntu${UBUNTU_VERSION}-${TIMESTAMP}" >> $GITHUB_OUTPUT

          echo "📦 已打包: $ARCHIVE_NAME ($(du -h "$ARCHIVE_NAME" | cut -f1))"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: ${{ steps.package.outputs.release_name }}
          body: |
            ## ${{ steps.parse.outputs.package_names }} for Ubuntu ${{ steps.parse.outputs.ubuntu_version }}

            - **软件包**: ${{ steps.parse.outputs.package_names }}
            - **Ubuntu 版本**: ${{ steps.parse.outputs.ubuntu_version }}
            - **包含 .deb 文件数**: ${{ steps.download.outputs.deb_count }}

            ### 离线安装方法

            ```bash
            tar -xzf ${{ steps.package.outputs.archive_name }}
            sudo dpkg -i *.deb
            ```
          files: ${{ steps.package.outputs.archive_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 成功反馈
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const package_names = '${{ steps.parse.outputs.package_names }}';
            const ubuntu_version = '${{ steps.parse.outputs.ubuntu_version }}';
            const deb_count = '${{ steps.download.outputs.deb_count }}';
            const release_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${{ steps.package.outputs.tag_name }}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Deb 包下载成功！\n\n- **软件包**：${package_names}\n- **Ubuntu 版本**：${ubuntu_version}\n- **包含 .deb 文件数**：${deb_count}\n- **Release 链接**：[点击下载](${release_url})`
            });

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['success']
            });

            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });

      - name: 失败反馈
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const package_names = '${{ steps.parse.outputs.package_names }}';
            const ubuntu_version = '${{ steps.parse.outputs.ubuntu_version }}';
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ Deb 包下载失败\n\n- **软件包**：${package_names}\n- **Ubuntu 版本**：${ubuntu_version}\n- **构建日志**：[点击查看](${run_url})`
            });

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['failure']
            });

            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
