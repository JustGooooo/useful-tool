---
name: Maven 包下载请求
description: 下载指定 Maven 包及其所有依赖，打包发布到 Release，支持导入 Nexus 或本地仓库
title: "[maven] "
labels: ["maven-downloader"]
body:
  - type: input
    id: maven_coordinate
    attributes:
      label: Maven 坐标
      description: "格式：groupId:artifactId:version"
      placeholder: "org.apache.commons:commons-lang3:3.14.0"
    validations:
      required: true

  - type: dropdown
    id: classifiers
    attributes:
      label: 附加内容
      description: "是否下载源码和 javadoc"
      options:
        - "仅主包（不下载源码和 javadoc）"
        - "同时下载源码（sources）"
        - "同时下载 javadoc"
        - "同时下载源码和 javadoc"
    validations:
      required: true

  - type: dropdown
    id: transitive
    attributes:
      label: 是否下载传递依赖
      options:
        - "是，下载所有传递依赖"
        - "否，仅下载主包"
    validations:
      required: true

  - type: input
    id: repository_url
    attributes:
      label: 仓库地址（可选）
      description: "留空则使用 Maven Central，可填写私有仓库地址"
      placeholder: "留空=Maven Central"
    validations:
      required: false
