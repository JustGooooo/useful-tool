---
name: Docker 镜像下载请求
description: 下载指定 Docker 镜像并打包发布到 Release
title: "[docker] "
labels: ["docker-downloader"]
body:
  - type: textarea
    id: images
    attributes:
      label: 镜像列表
      description: "每行一个镜像，格式如 nginx:latest 或 ghcr.io/owner/repo:tag"
      placeholder: |
        nginx:latest
        redis:7-alpine
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: CPU 架构
      options:
        - "linux/amd64"
        - "linux/arm64"
        - "linux/arm/v7"
        - "windows/amd64"
    validations:
      required: true
