---
name: Deb 包下载请求
description: 下载指定 Ubuntu 版本的 .deb 包及其依赖，打包发布到 Release
title: "[deb] "
labels: ["deb-downloader"]
body:
  - type: input
    id: package_name
    attributes:
      label: 软件包名
      description: "要下载的 apt 包名（如 nginx、vim、curl）"
      placeholder: "nginx"
    validations:
      required: true

  - type: input
    id: ubuntu_version
    attributes:
      label: Ubuntu 版本
      description: "填写 Ubuntu 版本号（如 22.04、24.04、26.04）"
      placeholder: "24.04"
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: 包版本（可选）
      description: "留空则下载最新版本，填写则指定版本（如 1.24.0-1ubuntu1）"
      placeholder: "留空=最新版本"
    validations:
      required: false

  - type: textarea
    id: custom_repos
    attributes:
      label: 自定义仓库（可选）
      description: "每行一个，格式：仓库地址|GPG Key URL（无 GPG Key 则只填仓库地址）"
      placeholder: |
        https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list|https://nvidia.github.io/libnvidia-container/gpgkey
    validations:
      required: false
